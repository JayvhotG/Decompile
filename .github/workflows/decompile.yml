name: Decompile LuaJIT Bytecode

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect LuaJIT bytecode file
        id: detect
        run: |
          echo "Looking for LuaJIT bytecode files..."
          FILE=""
          for f in *.lua; do
            [ -f "$f" ] || continue
            MAGIC=$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')
            echo "  $f  first 3 bytes = $MAGIC"
            if [ "$MAGIC" = "1b4c4a" ]; then
              FILE="$f"
              echo "  -> LuaJIT bytecode detected"
              break
            fi
          done
          if [ -z "$FILE" ]; then
            echo "::error::No LuaJIT bytecode file (magic 1b 4c 4a) found"
            ls -la
            exit 1
          fi
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Set up Python and Rust
        run: |
          # Python is needed for the corrected LJD fork
          python3 --version
          # Install Rust for unluac-rs if we need to build from source
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"

      - name: Attempt 1 - LuaJIT Decompiler v2 (prebuilt binary)
        id: v2
        continue-on-error: true
        run: |
          rm -f decompiled.lua
          # Try to download the latest Linux binary from releases
          # The asset name pattern is often "luajit-decompiler-v2" or similar.
          # We use the GitHub API to find the latest release's assets.
          echo "Fetching latest release info for luajit-decompiler-v2..."
          RELEASE_JSON=$(curl -s https://api.github.com/repos/marsinator358/luajit-decompiler-v2/releases/latest)
          BIN_URL=$(echo "$RELEASE_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for asset in data.get('assets', []):
              if 'linux' in asset['name'].lower() and 'x86_64' in asset['name'].lower():
                  print(asset['browser_download_url'])
                  break
          ")
          if [ -z "$BIN_URL" ]; then
            echo "No prebuilt Linux binary found in latest release."
            exit 1
          fi
          echo "Downloading: $BIN_URL"
          curl -L -o decompiler "$BIN_URL"
          chmod +x decompiler
          # Run the decompiler. It may output to a default 'output' folder or require an -o flag.
          # We try the documented command-line style first.
          ./decompiler "${{ steps.detect.outputs.file }}" -o decompiled.lua > v2.log 2>&1 || true
          if [ ! -s decompiled.lua ]; then
            # If that fails, try without -o (it might place it in ./output/)
            ./decompiler "${{ steps.detect.outputs.file }}" >> v2.log 2>&1 || true
            if [ -f "output/$(basename "${{ steps.detect.outputs.file }}" .lua).lua" ]; then
              cp "output/$(basename "${{ steps.detect.outputs.file }}" .lua).lua" decompiled.lua
            fi
          fi
          echo "--- v2 log (tail) ---"
          tail -n 20 v2.log || true
          if [ -s decompiled.lua ]; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "✅ LuaJIT Decompiler v2 succeeded!"
          else
            echo "result=failed" >> $GITHUB_OUTPUT
            echo "❌ LuaJIT Decompiler v2 failed."
          fi

      - name: Attempt 2 - unluac-rs (CLI)
        if: steps.v2.outputs.result != 'success'
        id: unluac
        continue-on-error: true
        run: |
          rm -f decompiled.lua
          # Try to download a prebuilt binary from unluac-rs releases
          echo "Fetching latest release info for unluac-rs..."
          RELEASE_JSON=$(curl -s https://api.github.com/repos/x3zvawq/unluac-rs/releases/latest)
          BIN_URL=$(echo "$RELEASE_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for asset in data.get('assets', []):
              if 'linux' in asset['name'].lower() and ('x86_64' in asset['name'].lower() or 'amd64' in asset['name'].lower()):
                  print(asset['browser_download_url'])
                  break
          ")
          if [ -n "$BIN_URL" ]; then
            echo "Downloading: $BIN_URL"
            curl -L -o unluac-cli "$BIN_URL"
            chmod +x unluac-cli
          else
            echo "No prebuilt binary. Building from source with cargo..."
            cargo install --path packages/unluac-cli --root /tmp/unluac
            # The binary will be in /tmp/unluac/bin/
            cp /tmp/unluac/bin/unluac-cli .
          fi
          ./unluac-cli -i "${{ steps.detect.outputs.file }}" -o decompiled.lua > unluac.log 2>&1 || true
          echo "--- unluac log (tail) ---"
          tail -n 20 unluac.log || true
          if [ -s decompiled.lua ]; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "✅ unluac-rs succeeded!"
          else
            echo "result=failed" >> $GITHUB_OUTPUT
            echo "❌ unluac-rs failed."
          fi

      - name: Attempt 3 - Corrected LJD fork (kanxue)
        if: steps.v2.outputs.result != 'success' && steps.unluac.outputs.result != 'success'
        id: ljd_fork
        continue-on-error: true
        run: |
          rm -f decompiled.lua
          # Clone the corrected fork mentioned in the kanxue thread
          git clone --depth 1 https://github.com/Dr-MTN/luajit-decompiler.git ljd_fork 2>/dev/null || true
          # If the above repo is not the correct fork, try the one from the thread.
          # The thread mentions a user "zx_lib.py", but the repo URL is not explicitly given.
          # We'll use the Dr-MTN repo as a base and apply the --catch_asserts flag,
          # but the real fix is likely in a different fork.
          # As a fallback, we can try the original LJD with more aggressive flags.
          git clone --depth 1 https://github.com/Dr-MTN/luajit-decompiler.git ljd2 2>/dev/null || true
          cd ljd2
          # Try running with --catch_asserts and -r (raw) if supported.
          python3 main.py -f "../${{ steps.detect.outputs.file }}" -o "../decompiled.lua" --catch_asserts > "../ljd_fork.log" 2>&1 || true
          cd ..
          echo "--- LJD fork log (tail) ---"
          tail -n 25 ljd_fork.log || true
          if [ -s decompiled.lua ]; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "✅ Corrected LJD fork succeeded!"
          else
            echo "result=failed" >> $GITHUB_OUTPUT
            echo "❌ Corrected LJD fork failed."
          fi

      - name: Show final result
        if: always()
        run: |
          echo "=============================="
          echo "          RESULTS"
          echo "=============================="
          ls -la
          echo ""
          if [ -s decompiled.lua ]; then
            echo "✅ Decompiled successfully!"
            echo "File size: $(wc -c < decompiled.lua) bytes"
            echo "Lines: $(wc -l < decompiled.lua)"
            echo ""
            echo "===== First 120 lines ====="
            head -n 120 decompiled.lua
          else
            echo "❌ All decompilation attempts failed."
            for log in v2.log unluac.log ljd_fork.log; do
              if [ -f "$log" ]; then
                echo "--- $log (tail) ---"
                tail -n 30 "$log"
              fi
            done
          fi

      - name: Commit decompiled result to repo
        if: hashFiles('decompiled.lua') != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add decompiled.lua
          git commit -m "Add decompiled source for ${{ steps.detect.outputs.file }}" || echo "Nothing to commit"
          git push || echo "Nothing to push"

      - name: Upload artifact (backup download)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decompilation-result
          path: |
            decompiled.lua
            v2.log
            unluac.log
            ljd_fork.log
          if-no-files-found: warn
          retention-days: 30
